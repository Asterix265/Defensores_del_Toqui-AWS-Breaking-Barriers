name: CI

# En main la corre desplegar.yml (workflow_call) antes de desplegar (despliegue-continuo, D4).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    # Las pruebas e2e de la API crean y migran su propia base `toqui_test` en este Postgres.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: toqui
          POSTGRES_PASSWORD: toqui_local
          POSTGRES_DB: toqui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toqui -d toqui"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CDK_DISABLE_CLI_TELEMETRY: 'true'
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Activar pnpm con Corepack
        run: corepack enable

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Preparar paquetes generados
        run: pnpm --filter "@toqui/ia..." build && pnpm --filter @toqui/api prisma:generate

      - name: Lint y formato
        run: pnpm lint && pnpm format:check

      - name: Tipos
        run: pnpm typecheck

      - name: Pruebas
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Contrato sin diferencias
        run: |
          pnpm contract
          git diff --exit-code -- apps/api/openapi.json apps/web/src/api/generated

      - name: Síntesis de infraestructura
        run: pnpm infra:synth
