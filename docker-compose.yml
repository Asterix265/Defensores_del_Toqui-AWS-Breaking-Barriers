services:
  postgres:
    image: postgres:17
    container_name: toqui-postgres
    environment:
      POSTGRES_USER: toqui
      POSTGRES_PASSWORD: toqui_local
      POSTGRES_DB: toqui
    ports:
      - '5432:5432'
    volumes:
      - toqui-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U toqui -d toqui']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  toqui-pgdata:
